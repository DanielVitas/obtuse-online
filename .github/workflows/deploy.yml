name: Deploy web build to GitHub Pages

# Builds the browser version of Obtuse and publishes it to GitHub Pages on every push to
# main. Nothing but a JDK is needed: WEB_ONLY=1 leaves the :android module (and its Android
# SDK requirement) out of the build — see settings.gradle.

on:
  push:
    branches: [main]
  workflow_dispatch:

# Permissions the deploy-pages action needs.
permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deployment at a time; newer pushes supersede in-flight ones.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Build web bundle (:teavm:buildRelease)
        env:
          WEB_ONLY: '1'
        run: ./gradlew :teavm:buildRelease --no-daemon --stacktrace

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: teavm/build/dist/webapp

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
