org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.daemon=true
org.gradle.configureondemand=false

# gdx-backend-android 1.14.2 depends on androidx.core, so the Android build must opt in to
# AndroidX. No legacy com.android.support deps remain, so Jetifier is not needed.
android.useAndroidX=true

# Upgraded from the 2018 1.9.8 because gdx-teavm (the browser backend) tracks current
# libGDX. The 2018 .so files in android/libs were built for 1.9.8 and would crash against
# this, so they are gone; Gradle now fetches matching natives from Maven instead.
gdxVersion=1.14.2

# gdx-teavm (xpenatan) is the browser backend; 1.5.6 is the release the ../spike proved
# works with libGDX 1.14.2 under TeaVM. Only the :teavm module uses this.
gdxTeaVMVersion=1.5.6
